services:
  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dogapidb
      POSTGRES_USER: dogapiuser
      POSTGRES_PASSWORD: dogapipassword

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=dogapidb
      - POSTGRES_USER=dogapiuser
      - POSTGRES_PASSWORD=dogapipassword
      - POSTGRES_HOST=db
    depends_on:
      - db

volumes:
  postgres_data:
